<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MileMarker RV</title>
<meta name="description" content="MileMarker RV trip planner: answer a few quick questions and get a day-by-day RV route with breaks and places to stay.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800;900&display=swap">
<style>
/* VOICE: clean, friendly co-driver; one question at a time, a little bit of game
   IDEA: the green highway mile-marker sign on a navy road at night with a yellow center line
   PICTURE: mile-marker signs that fill in as you answer, then become your day-by-day route
   COLOUR and TYPE: navy, highway green, reflective yellow, a coral focus ring on soft green paper; Overpass (Highway Gothic)
   LAYOUT: navy header with a yellow stripe, white cards, single column up to 920px */
:root{color-scheme:light dark;--navy:#062b44;--green:#007b52;--yellow:#ffba18;--coral:#ff553c;--bg:#f0f5f2;--paper:#fff;--ink:#102e3e;--muted:#4e666f;--line:#cbdad5;--soft:#e4f3eb;--warning:#fff1ce;--shadow:0 12px 34px #062b4410;
--sign:var(--green);--signd:#005c3d;--card:var(--paper);--mute:var(--muted);--yel:var(--yellow);--warn:#c2361f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081e2b;--paper:#102f40;--ink:#eff8f5;--muted:#bed2d6;--line:#3c5963;--soft:#153f38;--warning:#42371e;--shadow:none;--warn:#ff8a73}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#081e2b;--paper:#102f40;--ink:#eff8f5;--muted:#bed2d6;--line:#3c5963;--soft:#153f38;--warning:#42371e;--shadow:none;--warn:#ff8a73}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 Overpass,system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit}a{color:inherit}
h1,h2,h3,p{margin:0}h1,h2,h3{line-height:1.15;overflow-wrap:anywhere;text-wrap:balance}
h1{font-size:clamp(1.9rem,6vw,3.1rem);font-weight:900;letter-spacing:-.045em}h2{font-size:1.35rem;font-weight:800}h3{font-size:1.13rem;font-weight:800}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--yellow)}
.top,main,footer{width:min(100%,920px);margin:auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:68px}
.brand{font-size:1.25rem;font-weight:900;letter-spacing:-.05em;background:none;border:0;color:#fff;padding:8px 0;min-height:44px;cursor:pointer}
.head-actions{display:flex;align-items:center;gap:8px}
.points{font-weight:800;border-radius:99px;padding:4px 10px;font-size:.83rem;background:var(--yellow);color:#162d37;white-space:nowrap}
.theme{background:transparent;border:1px solid #7da0ab;color:#fff;min-width:44px;min-height:44px;border-radius:11px;cursor:pointer;padding:0}
#acctbtn{font-weight:800;font-size:.9rem;background:transparent;color:#fff;border:1px solid #7da0ab;border-radius:99px;padding:4px 12px 4px 4px;min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;max-width:40vw}
#acctbtn[hidden]{display:none}#acctbtn img{width:32px;height:32px;border-radius:50%;background:#fff}#acctbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding-top:24px;padding-bottom:28px;min-height:72vh}
footer{color:var(--muted);font-size:.85rem;padding-bottom:96px}
/* cards */
.q,.day,.stay,.saved,.route,.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.q{padding:clamp(18px,4vw,28px);max-width:640px;margin:0 auto}
.hero{display:grid;gap:18px;align-items:center;max-width:none}
.hero img{width:min(190px,55vw);border-radius:20px;justify-self:center;display:block}
.hero .hint{margin:10px 0 18px}
@media(min-width:620px){.hero{grid-template-columns:1fr 215px}.hero img{grid-column:2;grid-row:1}.hero>div{grid-column:1;grid-row:1}}
.step{font-size:.85rem;font-weight:800;color:var(--green);text-transform:none;margin-bottom:6px}
.q h2{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:900;letter-spacing:-.035em;margin-bottom:8px}
.hint,.meta{color:var(--muted)}.hint{margin:0 0 16px}.meta{font-size:.93rem}
.sec{font-size:1.35rem;font-weight:800;margin:24px 0 10px}
/* inputs and buttons */
input[type=text],input[type=number],input[type=date],input[type=time],select{width:100%;min-height:49px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:16px}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.btn,.chip{min-height:44px;border-radius:11px;border:1px solid var(--green);background:var(--green);color:#fff;padding:9px 16px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.2;cursor:pointer;box-shadow:inset 0 -3px #0002}
.btn.ghost,.chip{background:var(--paper);color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.y{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{min-height:42px;padding:7px 13px;font-size:.93rem}
.btn:disabled{opacity:.53;cursor:default}
.chip{font-size:.93rem}.chip.on{background:var(--soft);border-color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
@media(max-width:420px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--paper);color:var(--ink);cursor:pointer;min-height:55px;font-weight:800}
.opt small{display:block;color:var(--muted);font-weight:500;font-size:.85rem}
.opt.on{background:var(--green);border-color:var(--green);color:#fff}.opt.on small{color:#d6f0e4}
.opt .tick{display:none}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}
.toggle{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:800;min-height:44px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--green)}
.err{border-left:4px solid var(--coral);padding-left:9px;margin-top:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.95rem}
/* mile-marker signs */
.road{margin:0 auto 14px;max-width:640px}
.rd{display:flex;gap:6px;padding:3px 2px 9px;overflow-x:auto;scroll-snap-type:x proximity}
.rd .rdbar{display:none}
.rd .mk,.rd .lbl{position:static;transform:none}
.mk{display:grid;place-content:center;flex:0 0 auto;min-width:46px;min-height:52px;padding:4px 7px;background:var(--paper);color:var(--muted);border:2px solid var(--paper);border-radius:7px;box-shadow:0 0 0 1px var(--line);font-size:1.12rem;font-weight:900;text-decoration:none;line-height:1.02;text-align:center;scroll-snap-align:start}
.mk small{font-size:.56rem;letter-spacing:.08em}
.mk.on{background:var(--green);color:#fff;border-color:#fff;box-shadow:0 0 0 1px var(--green)}
.mk.cur{background:var(--yellow);color:var(--navy);border-color:#fff;box-shadow:0 0 0 1px var(--navy)}
.rd .lbl{display:none}
.strip{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:12px 12px 4px;margin-bottom:12px}
/* plan */
.sum{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,28px);box-shadow:var(--shadow)}
.sum h2{font-size:clamp(1.7rem,5.5vw,2.6rem);font-weight:900;letter-spacing:-.04em;margin-top:6px}
.sum>.meta:first-child{display:inline-block;font-weight:800;font-size:.83rem;border-radius:99px;padding:4px 10px;background:var(--soft);border:1px solid var(--line);color:var(--ink)!important}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:15px 0}
.kpi{background:var(--soft);border-radius:12px;padding:8px;text-align:center}
.kpi b{display:block;font-size:clamp(1.14rem,4vw,1.6rem);font-weight:900}.kpi span{display:block;color:var(--muted);font-size:.85rem}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{font-weight:800;border-radius:99px;padding:4px 10px;font-size:.83rem;background:var(--soft);border:1px solid var(--line)}
.route{display:block;width:100%;text-align:left;color:var(--ink);padding:12px 14px;margin-bottom:8px;cursor:pointer;border-radius:11px;box-shadow:none;font-weight:800}
.route.on{background:var(--green);border-color:var(--green);color:#fff}.route.on .meta{color:#d6f0e4}
.route b{font-size:1.05rem}.route .meta{font-weight:500}
@media(min-width:620px){.routes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.routes .route{margin:0}}
.day{padding:clamp(16px,4vw,24px);margin-bottom:14px;scroll-margin-top:10px}
.day h3{font-size:.9rem;font-weight:700;color:var(--muted)}
.day .leg{font-size:1.3rem;font-weight:800;line-height:1.2;margin:6px 0 10px}
.tl{list-style:none;padding:0;margin:12px 0}
.tl li{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:9px;padding:4px 0 4px 10px;border-left:2px solid var(--green)}
.tl time{font-weight:800;white-space:nowrap}
.stay{border-radius:12px;box-shadow:none;padding:12px;margin-top:9px}
.stay b{display:block;font-size:1.05rem}
.saved{display:block;width:100%;text-align:left;color:var(--ink);padding:12px 14px;margin-bottom:8px;cursor:pointer;border-radius:11px;box-shadow:none}
.warning{background:var(--warning);border-left:4px solid var(--yellow);padding:10px 13px;border-radius:8px;margin:8px 0}
#toast{position:fixed;left:50%;bottom:84px;top:auto;transform:translateX(-50%);z-index:35;background:var(--navy);color:#fff;border:1px solid #7895a1;border-radius:12px;padding:10px 15px;max-width:calc(100% - 24px);width:max-content;pointer-events:none;font-weight:700;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
.load{text-align:center;padding:30px 10px}.load .truck{animation:drive 1.6s ease-in-out infinite alternate}
@keyframes drive{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
/* chat */
#chatbtn{position:fixed;right:16px;bottom:18px;z-index:15;font-weight:900;border:2px solid var(--navy);border-radius:99px;padding:12px 20px;min-height:52px;background:var(--yellow);color:var(--navy);box-shadow:0 8px 22px #062b4433;cursor:pointer}
#chatbtn[hidden]{display:none}
#chat{position:fixed;z-index:30;right:16px;bottom:16px;width:min(420px,calc(100vw - 32px));height:min(640px,calc(100vh - 32px));background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 44px #00192766;display:flex;flex-direction:column;overflow:hidden}
#chat[hidden]{display:none}
@media(max-width:560px){#chat{right:0;bottom:0;width:100vw;height:88vh;border-radius:20px 20px 0 0}}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--navy);color:#fff;border-bottom:4px solid var(--yellow)}.chead span{display:block;font-size:.8rem;opacity:.85}
.chead button{font-weight:800;background:transparent;color:#fff;border:1px solid #7da0ab;border-radius:11px;padding:6px 12px;min-height:40px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:4px}.m.b{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.m.sys{align-self:center;background:transparent;color:var(--muted);font-size:.85rem;padding:2px}
.dots::after{content:"Thinking…";color:var(--muted)}
#sugg{padding:0 14px;margin:0 0 6px}#sugg .chip{min-height:38px;padding:6px 12px}
#chatform{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line)}#chatform input{flex:1}
/* account dialog */
#authwrap{position:fixed;inset:0;z-index:40;background:#001927bb;display:grid;place-items:center;padding:12px}#authwrap[hidden]{display:none}
#auth{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:17px;padding:20px;width:min(480px,100%);max-height:90dvh;overflow:auto}
#auth h2{font-size:1.6rem;font-weight:900;margin-bottom:6px}.abrand{display:flex;gap:12px;align-items:center;margin-bottom:14px}.abrand img{border-radius:12px}.abrand b{display:block;font-size:1.15rem}.abrand .meta{display:block}
.aform{display:grid;gap:10px;margin:10px 0}.aform label{display:grid;gap:4px;font-weight:600;font-size:.95rem}.aform fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;margin:0}.aform legend{font-weight:700;padding:0 4px}
.aform input[type=email],.aform input[type=password]{width:100%;min-height:49px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}
.aform .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.codein{font-size:1.6rem!important;letter-spacing:8px;text-align:center}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);margin:12px 0}.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--line)}
.linkbtn.strong{color:var(--green);font-weight:700;text-decoration:none;font-size:1rem;padding:0}
.ahead{display:flex;gap:12px;align-items:center}.avatar{width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.4rem;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 4px}.pstats div{background:var(--soft);border-radius:10px;padding:8px 4px;text-align:center}.pstats b{display:block;font-size:1.1rem}.pstats span{font-size:.75rem;color:var(--muted)}
@media(max-width:520px){#authwrap{padding:0;place-items:stretch}#auth{border-radius:0;max-height:none;height:100dvh;width:100%}}
#auth ul{margin:8px 0 14px;padding-left:20px}#auth li{margin:4px 0}
#gbtn{min-height:48px;margin:12px 0}
.tabs{display:flex;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--ink);font-weight:800;cursor:pointer}
.tabs button.on{background:var(--paper);box-shadow:0 2px 8px #062b4418}
.ask{background:var(--warning);border:1px solid var(--yellow);border-radius:16px;padding:14px 16px;margin:0 0 12px}
.stack{display:grid;gap:8px}
.packcat summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;min-height:44px;list-style:none}
.packcat summary::-webkit-details-marker{display:none}.pc-h{font-size:1.15rem;font-weight:800}
.plist{list-style:none;margin:6px 0 0;padding:0}
.ms{margin-top:12px}.ms-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.ms-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.mst{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:.88rem;min-width:0}
.mst b{display:block;font-weight:600;overflow-wrap:anywhere}.mst small{display:block}.msi{font-size:1.15rem;width:24px;text-align:center;flex:none}
.mst.ok{border-style:solid;border-color:var(--green);background:var(--soft);color:var(--ink)}.mst.ok b{font-weight:700}.mst.ok small{color:var(--green);font-weight:700}
.who{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding-left:34px}
.wchip{font:inherit;font-size:.82rem;min-height:32px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.wchip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.drive{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.drive.on{border-color:var(--green);box-shadow:0 4px 18px rgba(0,0,0,.06)}
.drive.done{border-color:var(--green);background:var(--soft)}.dh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:baseline}.dh b{font-size:1.08rem}
.dnext{margin:8px 0 0;line-height:1.4}.due{color:var(--warn)}.dalert{display:grid;grid-template-columns:1fr auto;gap:2px 8px;background:#fff7e0;border:1px solid #e9c46a;border-radius:10px;padding:10px;margin-bottom:10px}
.dalert span{grid-column:1;font-size:.92rem}.dalert button{grid-row:1/3;grid-column:2;align-self:start}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:.85rem;padding:8px 0 0;cursor:pointer;min-height:32px}
.tl li.done{color:var(--muted)}.tl li.now span{font-weight:700;color:var(--green)}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.pitem label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-height:44px}
.pitem input[type=checkbox]{width:24px;height:24px;flex:none;margin-top:1px;accent-color:var(--green)}
.pitem small{display:block;font-size:.85rem}.pitem.done b{text-decoration:line-through;color:var(--muted)}
.qty{font-weight:700;color:var(--green);font-size:.9rem}.pnote{color:var(--ink);background:var(--soft);border-radius:6px;padding:2px 6px;margin-top:3px;display:inline-block!important}
.pacts{display:flex;gap:4px}.pacts .btn{min-height:38px;padding:5px 10px}
.pnoteform,.paddform{display:flex;gap:6px;grid-column:1/-1;margin-top:6px}.paddform{margin-top:10px}
.pnoteform input,.paddform input{flex:1;min-height:44px}
.savedc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.savedc details.saved{border:0;padding:0;margin:0;background:none}.peek{display:inline-block;margin-top:4px;font-size:.85rem;color:var(--green);font-weight:600}
details.saved[open] .peek{display:none}.delask{margin-top:10px;padding:10px;border:1px solid #e3b4ae;background:#fdf1ef;border-radius:10px;font-size:.92rem}.btn.danger{background:#b3261e;border-color:#b3261e;color:#fff}
.startbtn{width:100%;margin-top:10px;justify-content:center}.tripbtns{margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.tripbtns .btn{padding-left:6px;padding-right:6px;justify-content:center}
details.saved summary{list-style:none;cursor:pointer}details.saved summary::-webkit-details-marker{display:none}
details.saved .tl{margin:10px 0 4px}
@media(max-width:420px){.pitem{grid-template-columns:minmax(0,1fr)}.pacts{justify-content:flex-end}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.load .truck{animation:none}#toast{transition:none}}
</style>
</head>
<body>
<header><div class="top"><button id="home" class="brand">MileMarker</button><div class="head-actions"><span id="points" class="points">0 pts</span><button class="theme" id="theme" aria-label="Switch light and dark mode" title="Switch light and dark mode">◐</button><button id="acctbtn" hidden>Sign in</button></div></div></header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<button id="chatbtn" hidden aria-haspopup="dialog">Ask MileMarker</button>
<div id="authwrap" hidden><section id="auth" role="dialog" aria-modal="true" aria-label="Your MileMarker account"></section></div>
<section id="chat" hidden role="dialog" aria-label="Chat with MileMarker">
  <div class="chead"><div><b>Ask MileMarker</b><span>Plan or change your trip by chatting</span></div><button id="chatclose" aria-label="Close chat">Close</button></div>
  <div id="msgs" aria-live="polite"></div>
  <div id="sugg" class="chips"></div>
  <form id="chatform"><input id="chatin" type="text" autocomplete="off" placeholder="Ask anything about your trip…" aria-label="Message"><button class="btn sm" id="chatsend">Send</button></form>
</section>
<footer>MileMarker plans are estimates. Phone map apps don't know your RV's height or weight — check clearances with an RV route planner, and confirm campgrounds by phone.</footer>

<script>
{
/* ===== Settings for your own website =====
   AI_ENDPOINT: URL of your Cloudflare Worker (see worker.js). Leave "" to plan without AI. */
const AI_ENDPOINT=/github\.io$/.test(location.hostname)?"":"/api";
/* On Vercel, set AI_ENDPOINT to "/api" (the app's own back end). */

function findPlace(txt){const n=norm(txt);if(!n)return null;
  const tries=[n];const parts=String(txt).split(",").map(x=>x.trim()).filter(Boolean);if(parts.length>=2)tries.push(norm(parts.slice(-2).join(" ")),norm(parts.slice(-3,-1).join(" ")));parts.forEach(p=>tries.push(norm(p)));

function mergePack(oldItems,newItems){const key=x=>x.cat+"|"+x.text;const old=new Map((oldItems||[]).map(x=>[key(x),x]));const custom=(oldItems||[]).filter(x=>x.custom);

/* ===== drive mode: live day, reminders, and learning from real drives ===== */
const hourOf=ts=>{const d=new Date(ts);return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600};
const mins=h=>{const m=Math.max(0,Math.round(h*60));return m>=60?`${Math.floor(m/60)} hr${m>=120?"s":""}${m%60?` ${m%60} min`:""}`:`${m} min`};
let learnCache=null;
function learned(){if(learnCache!==null)return learnCache||null;
  let ph=0,ah=0,mi=0,n=0;const bm=[],starts=[];
  saved.forEach(t=>((t.plan&&t.plan.days)||[]).forEach(d=>{const L=d.log;if(!L||!L.start||!L.end)return;
    const brk=(L.breaks||[]).filter(b=>b.e).reduce((a,b)=>a+(b.e-b.s),0),drive=(L.end-L.start-brk)/36e5;if(drive<0.25||drive>16)return;
    ph+=L.planH||d.hours||d.miles/SPEED;ah+=drive;mi+=d.miles;n++;starts.push(hourOf(L.start));
    (L.breaks||[]).forEach(b=>{if(b.e&&!b.lunch){const m=(b.e-b.s)/6e4;if(m>=2&&m<=120)bm.push(m)}})}));
  if(!n){learnCache=false;return null}
  learnCache={days:n,pace:Math.min(1.4,Math.max(0.8,ah/ph)),mph:Math.round(mi/ah),
    brkMin:bm.length?Math.round(Math.min(60,Math.max(10,bm.reduce((a,b)=>a+b,0)/bm.length))):BREAKMIN,
    start:starts.reduce((a,b)=>a+b,0)/starts.length};return learnCache}
const planH=d=>(d.hours||d.miles/SPEED)*((learned()||{}).pace||1);
const brkH=()=>((learned()||{}).brkMin||BREAKMIN)/60;
const isLunchHour=h=>h>=11.5&&h<13.6;

/* Live view of a day that has been started. Breaks are spaced by driving time since the last real break,
   so a long or late break pushes everything after it. */
function liveDay(d,st,now){const L=d.log,H=L.planH?L.planH*((learned()||{}).pace||1):planH(d),mph=d.miles/H,brs=L.breaks||[],open=brs.find(b=>!b.e),end=L.end||now;
  const brkTime=brs.reduce((a,b)=>a+((b.e||end)-b.s),0),driven=Math.max(0,Math.min(H,(end-L.start-brkTime)/36e5));
  const items=[[hourOf(L.start),`Left ${d.from}`,"done"]];
  brs.forEach(b=>items.push([hourOf(b.s),`${b.lunch?"Lunch break":"Break"}${b.mi?` · mile ${b.mi}`:""}${b.e?` · ${mins((b.e-b.s)/36e5)}`:" — on break now"}`,b.e?"done":"now"]));
  if(L.end){items.push([hourOf(L.end),`Arrived ${d.to}`,"done"]);return{items,done:true,driven,mph,H,arrive:hourOf(L.end),toGo:0}}

  const last=brs.filter(b=>b.e).pop(),since=open?0:Math.max(0,(now-(last?last.e:L.start))/36e5);
  let rem=H-driven,c=0,first=Math.max(0,st.brk-since),next=null;const fut=[];
  for(let gap=first;rem-gap>0.5;gap=st.brk){t+=gap;c+=gap;rem-=gap;const lunch=!lunchDone&&isLunchHour(t);if(lunch)lunchDone=true;
    fut.push([t,`${lunch?"Lunch break":"Break"} · about mile ${Math.round((driven+c)*mph)}`,"next",{kind:"break",lunch,mi:Math.round((driven+c)*mph),away:c*mph,at:t}]);
    t+=lunch?st.lunch:brkH()}

function activeDrive(){for(const t of saved)for(const [i,d] of ((t.plan&&t.plan.days)||[]).entries())if(d.log&&d.log.start&&!d.log.end)return{t,i,d};return null}
function saveDrive(){learnCache=null;persist();const a=activeDrive(),e=a?a.t:cur();if(me&&e)Store.saveTrip(e).catch(()=>{})}
function notify(title,body){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  let shown=false;try{if("Notification" in window&&Notification.permission==="granted"){new Notification(title,{body,tag:"mm-drive"});shown=true}}catch(e){}
  ui.alert={title,body,at:Date.now()};toast(title);if(!shown||document.visibilityState==="visible")render()}
function driveTick(){const a=activeDrive();if(!a)return;const L=a.d.log;L.notified=L.notified||{};const st=style(),lv=liveDay(a.d,st,Date.now()),n=lv.next;if(!n)return;
  const inMin=(n.at-lv.nowH)*60,key=n.kind==="arrive"?"arr":"b"+((L.breaks||[]).length+1);let changed=false;
  if(!lv.open&&n.kind==="break"){
    if(inMin<=30&&inMin>1&&!L.notified[key+"-30"]){L.notified[key+"-30"]=1;changed=true;notify(`${n.lunch?"Lunch stop":"Next break"} in ${Math.round(inMin)} min`,`About ${Math.round(n.away)} miles away, near mile ${n.mi}. Start looking for a rest area or a safe exit.`)}
    else if(inMin<=1&&!L.notified[key+"-now"]){L.notified[key+"-now"]=1;changed=true;notify(`Time for a ${n.lunch?"lunch ":""}break`,`You've driven ${mins(st.brk)}. Pull over when it's safe and tap “Start break”.`)}}
  if(n.kind==="arrive"&&inMin<=30&&inMin>0&&!L.notified["arr-30"]){L.notified["arr-30"]=1;changed=true;notify(`${a.d.to.split(",")[0]} in about ${Math.round(inMin)} min`,`About ${Math.round(n.away)} miles to go. Have the campground's check-in info ready.`)}
  if(lv.open&&!L.notified["end"+lv.open.s]&&(Date.now()-lv.open.s)/6e4>=(lv.open.lunch?st.lunch*60:brkH()*60)){L.notified["end"+lv.open.s]=1;changed=true;notify("Break time is up",`Tap “End break” when you're back on the road — we'll update your times.`)}
  if(changed)saveDrive();
  const f=document.activeElement;if(!(f&&f.closest&&f.closest("form"))&&plan&&ui.tab!=="pack")render()}
setInterval(driveTick,30000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")driveTick()});

function driveCard(){const e=cur(),st=style();
  if(!e)return `<div class="drive"><div class="dh"><b>🚐 Ready to go?</b></div><p class="meta" style="margin:4px 0 8px">Start the trip when you pull out. We'll remind you 30 minutes before each stop and update your times as you go.</p><div class="row"><button class="btn" data-savestart="1">▶ Start trip</button></div></div>`;
  const a=activeDrive();
  if(a&&a.t!==e)return `<div class="drive"><b>🚐 You're on the road</b><p class="meta" style="margin:4px 0 0">Day ${a.i+1} of another trip is in progress: ${esc(a.d.from)} → ${esc(a.d.to)}.</p></div>`;
  const al=ui.alert&&Date.now()-ui.alert.at<15*6e4?`<div class="dalert" role="alert"><b>${esc(ui.alert.title)}</b><span>${esc(ui.alert.body)}</span><button class="btn ghost sm" data-dismiss="1" aria-label="Dismiss">✕</button></div>`:"";
  const perm="Notification" in window&&Notification.permission==="default"?`<button class="btn ghost sm" data-notify="1">🔔 Turn on alerts</button>`:"";
  if(a){const d=a.d,lv=liveDay(d,st,Date.now()),n=lv.next,inMin=n?(n.at-lv.nowH)*60:0;
    return `<div class="drive on">${al}<div class="dh"><b>🚐 Day ${a.i+1} · ${lv.open?"on a break":"on the road"}</b><span class="meta">${mins(lv.driven)} driven · ${Math.round(lv.driven*lv.mph)} mi</span></div>
    ${lv.open?`<p class="dnext">☕ ${lv.open.lunch?"Lunch":"Break"} for ${mins((Date.now()-lv.open.s)/36e5)} <span class="meta">· planned ${mins(lv.open.lunch?st.lunch:brkH())}</span></p>`
      :n&&n.kind==="break"?`<p class="dnext">Next: <b>${n.lunch?"Lunch break":"Break"}</b> ${inMin<=1?"<b class=\"due\">now</b>":`in ${mins(inMin/60)}`} · about ${Math.round(n.away)} mi away <span class="meta">(${clock(n.at)}, near mile ${n.mi})</span></p>`:""}
    <p class="dnext">Arrive <b>${esc(d.to.split(",")[0])}</b> about <b>${clock(lv.arrive)}</b> · ${Math.round(lv.toGo)} mi to go</p>
    <div class="row">${lv.open?`<button class="btn" data-brkend="1">End break</button>`:`<button class="btn" data-brkstart="1">Start break</button>`}<button class="btn y" data-arrive="1">I've arrived</button>${perm}</div>
    <p class="meta" style="margin:6px 0 0">Reminders come 30 minutes before each stop while MileMarker is open on your phone. Keep your eyes on the road — let a passenger tap the buttons.</p>
    <button class="linkbtn" data-dreset="${a.i}">${ui.confirmReset===a.i?"Tap again to clear today's log":"Started by mistake? Clear today"}</button></div>`}
  const p=e.plan,ix=p.days.findIndex(d=>!(d.log&&d.log.end));
  if(ix<0){const logs=p.days.map(d=>d.log),drove=logs.reduce((s,L)=>s+(L.end-L.start-(L.breaks||[]).reduce((a,b)=>a+((b.e||L.end)-b.s),0))/36e5,0),pl=p.days.reduce((s,d)=>s+(d.log.planH||d.hours||d.miles/SPEED),0),nb=logs.reduce((s,L)=>s+(L.breaks||[]).length,0);

function dayTimeline(d,st){if(d.log&&d.log.start){const lv=liveDay(d,st,Date.now());return{items:lv.items,arrive:lv.arrive,live:true}}const h=planH(d),nb=Math.max(0,Math.ceil(h/st.brk)-1),items=[];let t=d.start!=null?d.start:START,driven=0;items.push([t,`Leave ${d.from}`]);
